<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Your Comic - ComicCraft</title>

    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

    <div class="container">

        <h1>Your Comic</h1>

        <p>Here is your AI-generated comic!</p>

        <div class="comic-container">

            {% for panel in comic %}

            <div class="comic-panel">

                <h2>
                    Panel {{ panel.panel }}:
                    {{ panel.title }}
                </h2>

                <img src="{{ panel.image }}" alt="Comic Panel {{ panel.panel }}">

                <p>
                    <strong>Scene:</strong>
                    {{ panel.scene_description }}
                </p>

                <p>
                    <strong>Narration:</strong>
                    {{ panel.narration }}
                </p>

                <p>
                    <strong>Dialogue:</strong>
                    {{ panel.dialogue }}
                </p>

            </div>

            {% endfor %}

        </div>

        <a href="/export">
            <button type="button">Download PDF</button>
        </a>

    </div>

</body>

</html>
